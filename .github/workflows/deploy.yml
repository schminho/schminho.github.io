name: Deploy Vite App to GitHub Pages

on:
  push:
    branches:
      - main  # Change if your default branch is different

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages  # ✅ REQUIRED to fix the error

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install Dependencies
        run: npm ci  # ✅ More stable than npm install

      - name: Build Vite App
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # ✅ Ensures `dist/` is uploaded for GitHub Pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
