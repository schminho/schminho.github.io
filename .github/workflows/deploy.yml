name: Deploy Vite App

on:
  push:
    branches:
      - main  # Change this if you deploy from a different branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18  # Match your Vite setup
          cache: "npm"

      - name: Install Dependencies
        run: npm ci # More stable than npm install

      - name: Build Vite App
        run: npm run build

      - name: Deploy
        run: |
          echo "🚀 Deploying..."
          # Add your deployment command here (Netlify, Vercel, FTP, etc.)
